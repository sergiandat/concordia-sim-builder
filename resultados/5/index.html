<style>
body { font-family: Arial, sans-serif; margin: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
.container { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
.tab { overflow: hidden; border-bottom: 2px solid #ddd; margin-bottom: 15px; }
.tab button { background-color: #f1f1f1; border: none; padding: 12px 24px; cursor: pointer; font-size: 14px; transition: all 0.3s; border-radius: 4px 4px 0 0; margin-right: 2px; }
.tab button:hover { background-color: #ddd; }
.tab button.active { background-color: #667eea; color: white; }
.tabcontent { display: none; padding: 15px; animation: fadeIn 0.3s; }
.tabcontent.active { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.step { margin: 10px 0; padding: 10px; background: #f9f9f9; border-left: 3px solid #667eea; border-radius: 4px; }
.step-header { font-weight: bold; color: #333; margin-bottom: 8px; }
.entry { margin: 5px 0; padding: 8px; background: white; border-radius: 4px; }
.entry-entity { color: #667eea; font-weight: bold; }
.entry-component { color: #888; font-size: 12px; }
.entry-summary { margin: 5px 0; }
.content-block { margin: 5px 0; padding: 8px; background: #f0f0f0; border-radius: 4px; font-family: monospace; font-size: 12px; white-space: pre-wrap; word-wrap: break-word; max-height: 200px; overflow-y: auto; }
.content-label { font-weight: bold; color: #555; font-size: 11px; text-transform: uppercase; }
.memory-item { margin: 5px 0; padding: 8px; background: #f9f9f9; border-radius: 4px; }
details { margin: 5px 0; }
details summary { cursor: pointer; font-weight: bold; padding: 5px; background: #f0f0f0; border-radius: 4px; }
details[open] summary { background: #e0e0e0; }
/* Step-level details get special styling with a colored left border */
details.step-details { margin: 10px 0; border-left: 3px solid #667eea; padding-left: 10px; }
details.step-details > summary { background: #e8e8ff; font-size: 14px; }
details.step-details[open] > summary { background: #d8d8ff; }
/* Content inside steps is indented */
details.step-details > details { margin-left: 15px; }
.summary { padding: 10px; background: #e8f4f8; border-radius: 4px; margin-bottom: 15px; }
h1 { color: #333; margin-bottom: 5px; }
.subtitle { color: #666; margin-bottom: 20px; }
</style>

<script>
const CONTENT_STORE = {"d5e7fe82653329e1": "Evitar comprometer fondos sin respaldo tecnico verificado.", "df2a7bf36c469044": "The instructions for how to play the role of Ana Duarte \u2014 Finanzas are as follows. This is a social science experiment studying how well you play the role of a character named Ana Duarte \u2014 Finanzas. The experiment is structured as a tabletop roleplaying game (like dungeons and dragons). However, in this case it is a serious social science experiment and simulation. The goal is to be realistic. It is important to play the role of a person like Ana Duarte \u2014 Finanzas as accurately as possible, i.e., by responding in ways that you think it is likely a person like Ana Duarte \u2014 Finanzas would respond, and taking into account all information about Ana Duarte \u2014 Finanzas that you have. Always use third-person limited perspective.", "c67ce3a1cb5dd7b6": "\nQuestion: What would a person like Ana Duarte \u2014 Finanzas do in a situation like this?\nAnswer", "f9a1ae502c6fcde8": "What would a person like Ana Duarte \u2014 Finanzas do in a situation like this? Respond using 1-5 sentences.", "c89fad2fd029be6a": "Ana Duarte \u2014 Finanzas would refuse to authorize the disbursement until all pending technical and environmental validations are fully completed. True to her cautious and methodical nature, she would prioritize regulatory compliance over operational urgency to protect the company from severe audit penalties. Instead of giving in to Beto Salas's pressure, she would likely propose conditioning any partial release of funds strictly upon the receipt of the missing documentation.", "409f22583bf30f28": "Goal: Evitar comprometer fondos sin respaldo tecnico verificado.", "801e61b3e1b8066e": "Question: What kind of person is Ana Duarte \u2014 Finanzas?", "5d6d3c8504d08a67": "Answer: Ana Duarte \u2014 Finanzas is cautious, methodical, and deeply committed to regulatory compliance. She carefully weighs the operational urgency of projects against financial security protocols, refusing to bypass necessary technical validations even under intense pressure. Her deliberate approach demonstrates a strong sense of responsibility and integrity in safeguarding the company against severe compliance violations during audits.", "66c3f8f01344d0fc": "Question: What situation is Ana Duarte \u2014 Finanzas in right now?", "35837ac11ddf0351": "Answer: Ana Duarte \u2014 Finanzas is currently Ana Duarte \u2014 Finanzas is facing a high-pressure professional dilemma where she must decide whether to authorize funds for an urgent infrastructure equipment purchase without complete technical and environmental validations. She is caught between Beto Salas, who urgently needs the equipment to avoid program inactivity, and the severe risk of triggering a major compliance violation if she approves the disbursement during an ongoing audit. This situation forces her to weigh the immediate operational needs of the company against strict regulatory and financial security protocols.", "75980df02ed17d48": "[observation] // 10:00 AM, Sala de reuniones, S\u00e9ptimo piso // La sala de reuniones se siente peque\u00f1a. El aire acondicionado zumba con una frecuencia constante, casi sofocante, mientras sobre la mesa de caoba reposa el expediente del proyecto de infraestructura. Ana Duarte observa el documento abierto frente a ella; los informes t\u00e9cnicos est\u00e1n incompletos, faltando las validaciones de impacto ambiental de la \u00faltima fase. A su lado, Beto Salas mantiene una postura r\u00edgida, con la mirada fija en el informe, claramente impaciente por destrabar la compra de equipos que su programa necesita con urgencia. El silencio en la habitaci\u00f3n es tenso, marcado \u00fanicamente por el golpeteo constante de un bol\u00edgrafo contra el borde de la mesa.  Ana sabe que su firma en ese desembolso es el \u00faltimo filtro antes de que los fondos salgan. Si autoriza sin el respaldo t\u00e9cnico, el riesgo de que la auditor\u00eda en curso se convierta en una falta grave es alt\u00edsimo. Si se niega rotundamente, sabe que los equipos de Beto permanecer\u00e1n inactivos, lo que podr\u00eda derivar en un conflicto interno de mayor escala.  Ana, es tu turno. Beto te mira, esperando una se\u00f1al clara sobre c\u00f3mo proceder: \u00bfte inclinas por condicionar el desembolso a una entrega parcial, rechazarlo hasta completar la documentaci\u00f3n, o buscar alguna otra alternativa?  [VARIABLES: NONE]", "bb152962b99c578e": "Question: What would a person like Ana Duarte \u2014 Finanzas do in a situation like this? Respond using 1-5 sentences.", "0ec03fedd36349b7": "Answer: Ana Duarte \u2014 Finanzas would refuse to authorize the disbursement until all pending technical and environmental validations are fully completed. True to her cautious and methodical nature, she would prioritize regulatory compliance over operational urgency to protect the company from severe audit penalties. Instead of giving in to Beto Salas's pressure, she would likely propose conditioning any partial release of funds strictly upon the receipt of the missing documentation.", "a90494a197503832": "\nQuestion: What kind of person is Ana Duarte \u2014 Finanzas?\nAnswer", "8282d9de00323b82": "What kind of person is Ana Duarte \u2014 Finanzas? Respond using 1-5 sentences.", "8c779723cc405c83": "Ana Duarte \u2014 Finanzas is cautious, methodical, and deeply committed to regulatory compliance. She carefully weighs the operational urgency of projects against financial security protocols, refusing to bypass necessary technical validations even under intense pressure. Her deliberate approach demonstrates a strong sense of responsibility and integrity in safeguarding the company against severe compliance violations during audits.", "a2e3faa81c031cf1": "Question: What kind of person is Ana Duarte \u2014 Finanzas? Respond using 1-5 sentences.", "4c6872f04c8ff7b0": "\nQuestion: What situation is Ana Duarte \u2014 Finanzas in right now?\nAnswer", "39affda18441edec": "What kind of situation is Ana Duarte \u2014 Finanzas in right now? Respond using 1-5 sentences.", "b969212ebcf9af4a": "Ana Duarte \u2014 Finanzas is currently Ana Duarte \u2014 Finanzas is facing a high-pressure professional dilemma where she must decide whether to authorize funds for an urgent infrastructure equipment purchase without complete technical and environmental validations. She is caught between Beto Salas, who urgently needs the equipment to avoid program inactivity, and the severe risk of triggering a major compliance violation if she approves the disbursement during an ongoing audit. This situation forces her to weigh the immediate operational needs of the company against strict regulatory and financial security protocols.", "4ac457ff855595c2": "Question: What kind of situation is Ana Duarte \u2014 Finanzas in right now? Respond using 1-5 sentences.", "84d37f787a8527ba": "Event: En una peque\u00f1a sala de reuniones, Ana Duarte, responsable de Finanzas, mantiene una postura firme frente a Beto, cruzando los brazos sobre la mesa. Con voz calmada pero inflexible, Ana establece los l\u00edmites de su gesti\u00f3n: \"No puedo autorizar el desembolso en estas condiciones. Necesito la validaci\u00f3n de impacto ambiental completa antes de liberar cualquier fondo. Presiona a tu equipo t\u00e9cnico para acelerar el tr\u00e1mite, pero mi firma no se mover\u00e1 hasta tener el respaldo normativo en regla\". Como resultado de esta intervenci\u00f3n, la presi\u00f3n sobre Beto aumenta y la posibilidad de una aprobaci\u00f3n inmediata queda bloqueada.\n\n[VARIABLES: NONE]\n", "9559332624ba8d13": "Because of all that came before, what happens next?", "1b0cf01a291973da": "Game master instructions: :\nThis is a social science experiment. It is structured as a tabletop roleplaying game (like dungeons and dragons). You are the game master. You will describe the current situation to the participants in the experiment and then on t e 3 --- Response 3\nExercise: In what action spec format should Yorik respond? Respond in  one of the provided formats and use no additional words. --- {\"call_to_action\": \"What would Yorik do?\", \"output_type\": \"choice\", \"options\": [\"open the door\", \"bar the door\", \"flee\"], \"tag\": null}\n\nExercise 4 --- Response 4\nExercise: In what action spec format should Kerensa respond? Respond in  one of the provided formats and use no additional words. --- {\"call_to_action\": \"What would Kerensa say?\", \"output_type\": \"free\", \"options\": [], \"tag\": null}\n\nExercise 5 --- Response 5\nExercise: Because of all that came before, what happens next? --- What is Rowan attempting to do?\nRowan opens the enchanted storybook. --- Rowan opens the colorful storybook. As she turns the pages, she notices the delightful scent of cinnamon and vanilla fills the air, warm and inviting. Sparkling illustrations twinkle merrily on the pages, and leave a pleasant tingling on Rowan's fingers when she touches them. Rowan notices one section that glows slightly more brightly than the rest. It appears to be some kind of special chapter, marked by several golden ribbons.\n\nExercise 6 --- Response 6\nExercise: Is the game/simulation finished? --- No\n\nExercise 7 --- Response 7\nExercise: Is the game/simulation finished? --- Yes\n\n**--END EXAMPLES--**\n\nThe player characters are:\n:\nAna Duarte \u2014 Finanzas\nBeto Salas \u2014 Programa\n\nBackground info:\n[observation] [event] Dos responsables de un programa discuten si aprobar un desembolso de fondos que ya fue comprometido pero cuyo respaldo tecnico esta incompleto. Deben decidir si aprueban, condicionan o postergan. Ana arrastra una auditoria observada; Beto tiene equipos parados.  GROUNDED VARIABLES \u2014 you MUST track these quantitative variables as the simulation unfolds. After every event you narrate, append exactly one line in this format:   [VARIABLES: name1=value1, name2=value2] Include only variables that c ece viable estructurarlo as\u00ed para destrabar esto de una vez?\". Como resultado de esta propuesta, la negociaci\u00f3n se traslada al terreno de la viabilidad t\u00e9cnica y legal, obligando a Ana a considerar si la confianza personal en Beto es suficiente para mitigar el riesgo de la auditor\u00eda.\n\n[VARIABLES: NONE]\n", "d1803bae89150159": "Game master instructions: :\nThis is a social science experiment. It is structured as a tabletop roleplaying game (like dungeons and dragons). You are the game master. You will describe the current situation to the participants in the experiment and then on the basis of what you tell them they will suggest actions for the character they control. Aside from you, each other participant controls just one character. You are the game master so you may control any non-player character. You will track the state of the world and keep it consistent as time passes in the simulation and the participants take actions and change things in their world. The game master is also responsible for controlling the overall flow of the game, including determining whose turn it is to act, and when the game is over. The game master also must keep track of which players are aware of which events in the world, and must tell the player whenever anything happens that their character would be aware of. Always use third-person limited perspective, even when speaking directly to the participants. Try to ensure the story always moves forward and never gets stuck, even if the participants make repetitive choices.\n\nGame master workflow examples:\n\nExample exercises with default responses\n**--START EXAMPLES--**\n\nExercise 1 --- Response 1\nExercise: What is the current situation faced by Morwenna? What do they now observe? Only include information of which they are aware. --- Morwenna steps into the room. The air is thick and still, almost heavy. The only light comes from a single, bare bulb hanging precariously from the high ceiling, casting long, di u00f3n inmediata queda bloqueada.  [VARIABLES: NONE] ", "b29d3aaa44e49322": "Answer: En una reuni\u00f3n tensa para decidir el destino de un desembolso de fondos, Ana (Finanzas) y Beto (Operaciones) se encuentran en un punto de bloqueo. Mientras Beto necesita los recursos para poner en marcha equipos parados, Ana se niega rotundamente a autorizar el pago debido a la falta de respaldo t\u00e9cnico y a una auditor\u00eda pendiente en su \u00e1rea. La situaci\u00f3n actual, que requiere una resoluci\u00f3n de aprobaci\u00f3n, condicionamiento o postergaci\u00f3n, se mantiene estancada con un nivel de consenso inicial del 30% y la decisi\u00f3n final a\u00fan pendiente.", "8d0c1542be2c109e": "Comite de Desembolsos, En una reuni\u00f3n tensa para decidir el destino de un desembolso de fondos, Ana (Finanzas) y Beto (Operaciones) se encuentran en un punto de bloqueo. Mientras Beto necesita los recursos para poner en marcha equipos parados, Ana se niega rotundamente a autorizar el pago debido a la falta de respaldo t\u00e9cnico y a una auditor\u00eda pendiente en su \u00e1rea. La situaci\u00f3n actual, que requiere una resoluci\u00f3n de aprobaci\u00f3n, condicionamiento o postergaci\u00f3n, se mantiene estancada con un nivel de consenso inicial del 30% y la decisi\u00f3n final a\u00fan pendiente.", "d06232cf1913ab6f": "Comite de Desembolsos --- Event: En una tensa reuni\u00f3n en la sala de juntas, Beto Salas, responsable del Programa, intenta romper el bloqueo administrativo buscando una soluci\u00f3n de compromiso. Beto se ajusta la corbata, respira profundamente y se inclina sobre la mesa para confrontar a Ana con las consecuencias operativas de la inacci\u00f3n. Beto le propone lo siguiente: \"Ana, entiendo perfectamente tu posici\u00f3n y el riesgo al que te enfrentas con la auditor\u00eda, cr\u00e9eme que no quiero comprometerte ni saltarme los controles. Pero miremos esto de frente: si detenemos la ejecuci\u00f3n hoy, el costo pol\u00edtico y operativo para el progr   }

  let html = '';
  for (const [key, value] of Object.entries(obj)) {
    if (key !== 'date' && key !== 'Summary') {
      html += '<b><ul>' + escapeHtml(key) + '</b>';
      html += '<li>' + renderObject(value) + '</li></ul>';
    }
  }
  return html;
}

function renderGMLog() {
  const container = document.getElementById('gm_log');
  let html = '';

  // Group entries by step
  const stepMap = {};
  ENTRIES.forEach(entry => {
    if (!stepMap[entry.step]) stepMap[entry.step] = [];
    stepMap[entry.step].push(entry);
  });

  const steps = Object.keys(stepMap).map(Number).sort((a, b) => a - b);

  steps.forEach(step => {
    const entries = stepMap[step];
    
    // Build step summary from entries
    let stepSummary = 'Step ' + step;
    if (entries.length > 0 && entries[0].summary) {
      stepSummary += ' --- ' + entries[0].summary;
    }
    
    html += '<details class="step-details" open>';
    html += '<summary><b>' + escapeHtml(stepSummary) + '</b></summary>';

    entries.forEach(entry => {
      // Create a label for this entry (like "Entity [name]" or component name)
      let entryLabel = entry.entity_name;
      if (entry.entry_type === 'entity') {
        entryLabel = 'Entity [' + entry.entity_name + ']';
      }
      
      // If entry has deduplicated_data, render it as collapsible content
      if (entry.deduplicated_data && Object.keys(entry.deduplicated_data).length > 0) {
        html += '<details>';
        html += '<summary>' + escapeHtml(entryLabel) + '</summary>';
        // Render all the data in deduplicated_data recursively
        for (const [key, value] of Object.entries(entry.deduplicated_data)) {
          html += '<b><ul>' + escapeHtml(key) + '</b>';
          html += '<li>' + renderObject(value) + '</li></ul>';
        }
        html += '</details>';
      } else {
        // Simple entry with no data
        html += '<div class="entry">';
        html += '<span class="entry-entity">' + escapeHtml(entryLabel) + '</span>';
        html += ' <span class="entry-component">(' + escapeHtml(entry.component_name) + ')</span>';
        if (entry.summary) {
          html += '<div class="entry-summary">' + escapeHtml(entry.summary) + '</div>';
        }
        html += '</div>';
      }
    });

    html += '</details>';
  });

  container.innerHTML = html || '<p>No log entries.</p>';
}

function renderEntityMemories(entityName, containerId) {
  const container = document.getElementById(containerId);
  const memories = ENTITY_MEMORIES[entityName] || [];
  let html = '';

  if (memories.length === 0) {
    html = '<p>No memories for ' + escapeHtml(entityName) + '.</p>';
  } else {
    memories.forEach(mem => {
      html += '<div class="memory-item">' + escapeHtml(mem) + '</div>';
    });
  }

  container.innerHTML = html;
}

function renderGMMemories() {
  const container = document.getElementById('gm_memories');
  if (!container) return;

  let html = '';
  if (GM_MEMORIES.length === 0) {
    html = '<p>No game master memories.</p>';
  } else {
    GM_MEMORIES.forEach(mem => {
      html += '<div class="memory-item">' + escapeHtml(mem) + '</div>';
    });
  }

  container.innerHTML = html;
}

function openTab(evt, tabId) {
  // Hide all tab content
  document.querySelectorAll('.tabcontent').forEach(tc => {
    tc.classList.remove('active');
  });

  // Remove active class from all buttons
  document.querySelectorAll('.tablinks').forEach(btn => {
    btn.classList.remove('active');
  });

  // Show the selected tab
  document.getElementById(tabId).classList.add('active');
  evt.currentTarget.classList.add('active');
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
  renderGMLog();

  // Render entity memories
  Object.keys(ENTITY_MEMORIES).forEach(name => {
    const containerId = name.replace(/ /g, '_');
    if (document.getElementById(containerId)) {
      renderEntityMemories(name, containerId);
    }
  });

  renderGMMemories();
});
</script>
