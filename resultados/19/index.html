u00f3tesis: la c\u00e1mara podr\u00eda sostener el servicio con una persona con dedicaci\u00f3n parcial y sin presupuesto t\u00e9cnico propio. [starts at pendiente] \u2014 Sostenida si las tareas entran en la dedicaci\u00f3n parcial de la operadora; condicionada si depende de conseguir qui\u00e9n adapte y aloje la plataforma o de no asumir tareas de verificaci\u00f3n; no sostenida si excede sus recursos.   - h7_encontrarse_es_relevante_en_crisis (categorical): Hip\u00f3tesis: en el contexto de crisis, que marcas y talleres se encuentren es un problema relevante, y no solo la falta de pedidos. [starts at pendiente] \u2014 Sostenida si los participantes muestran que encontrarse les genera costos o p\u00e9rdidas concretas hoy; condicionada si solo importa en ciertas situaciones, como reemplazar talleres que cierran o temporada alta; no sostenida si el problema dominante es la falta de pedidos.   - formulacion_final (categorical): Formulaci\u00f3n final de la mesa sobre la idea. [starts at pendiente] \u2014 Debe fijarse \u00fanicamente cuando H\u00e9ctor Lan\u00fas \u2014 Comisi\u00f3n directiva formule la conclusi\u00f3n final en el \u00faltimo paso.  CRITICAL DECISION POINTS: - Step 1: SITUACI\u00d3N OBLIGATORIA, el participante del turno responde a esto antes que a cualquier otro tema. UNA MARCA BUSCA: Valeria Ortiz \u2014 Marca socia mediana necesita fabricar dos mil remeras en cinco semanas porque uno de sus talleres cerr\u00f3. En CIAI Conecta encuentra tres talleres con procesos y capacidad compatibles, pero la disponibilidad de los tres se actualiz\u00f3 por \u00faltima vez hace dos meses, y las fichas no dicen el pedido m\u00ednimo. Dice si los contacta, qu\u00e9 informaci\u00f3n le falta, qu\u00e9 har\u00eda adem\u00e1s de la plataforma y si seguir\u00eda us\u00e1ndola frente a sus contactos de siempre. - Step 2: SITUACI\u00d3N OBLIGATORIA, el participante del turno responde a esto antes que a cualquier otro tema. UN TALLER EVAL\u00daA REGISTRARSE: Rosa Mamani \u2014 Taller familiar quiere llegar a las marcas socias. Descubre que la PDT original solo mostraba en el directorio a talleres con CUIT verificado ante ARCA y que la ficha mostraba la etapa de formalizaci\u00f3n; para CIAI Conecta eso todav\u00eda no est\u00e1 decidido. Dice si se registra, qu\u00e9 informaci\u00f3n publicar\u00eda y cu\u00e1l no, qu\u00e9 tendr\u00eda que cambiar, y si un curso gratuito con certificado le dar\u00eda un motivo para sumarse. - Step 3: SITUACI\u00d3N OBLIGATORIA, el participante del turno responde a esto antes que a cualquier otro tema. LA CRISIS: Marcelo Paz \u2014 Cooperativa textil imagina sus primeros tres meses en CIAI Conecta: recibe cuatro consultas, tres piden solo precio y ninguna habla de continuidad, mientras en la zona hay cada vez m\u00e1s talleres ofreciendo trabajo. Dice si el problema de la cooperativa es que no la encuentran o que no hay pedidos, si seguir\u00eda manteniendo la ficha y qu\u00e9 har\u00eda distinta a CIAI Conecta de Semillero Textil. - Step 4: SITUACI\u00d3N OBLIGATORIA, el participante del turno responde a esto antes que a cualquier otro tema. UN RECLAMO: una marca socia contact\u00f3 a un taller a trav\u00e9s de CIAI Conecta y ahora le escribe a la c\u00e1mara denunciando que el taller incumpli\u00f3 plazos y calidad, y pide que lo saquen. Al mismo tiempo, otras marcas piden que la c\u00e1mara revise a los talleres antes de mostrarlos. Luc\u00eda Ferreyra \u2014 Operadora de la CIAI dice qu\u00e9 hace, cu\u00e1nto tiempo le lleva, si puede revisar talleres con su dedicaci\u00f3n parcial, qu\u00e9 significar\u00eda para la c\u00e1mara hacerlo y qu\u00e9 regla m\u00ednima har\u00eda falta tener escrita antes de lanzar. - Step 5: SITUACI\u00d3N OBLIGATORIA, el participante del turno responde a esto antes que a cualquier otro tema. BALANCE Y ALTERNATIVA: la Mesa resume lo dicho sobre cada hip\u00f3tesis y recuerda que existe Semillero Textil, un directorio argentino abierto y gratuito, con m\u00e1s de doscientos talleres de confecci\u00f3n, calificaciones con estrellas y un sello de verificado pago. H\u00e9ctor Lan\u00fas \u2014 Comisi\u00f3n directiva dice qu\u00e9 hip\u00f3tesis le parecen m\u00e1s d\u00e9biles; si la CIAI deber\u00eda hacer algo propio, aliarse con un directorio existente o no hacer nada; y si, con el sector en crisis, esto merece los recursos de la c\u00e1mara frente a otras urgencias. - Step 6: SITUACI\u00d3N OBLIGATORIA, el participante del turno responde a esto antes que a cualquier otro tema. VERSI\u00d3N M\u00cdNIMA: en esta segunda vuelta cada participante, empezando por Valeria Ortiz \u2014 Marca socia mediana, dice cu\u00e1l es la versi\u00f3n m\u00ednima de CIAI Conecta que estar\u00eda dispuesto a usar, ofrecer, sostener o apoyar: qu\u00e9 funcionalidades son indispensables, cu\u00e1les prescindibles y cu\u00e1les conflictivas, y qu\u00e9 compromiso concreto asumir\u00eda en un piloto de seis meses. Valeria dice tambi\u00e9n si la usar\u00eda sin que la c\u00e1mara verifique a los talleres. - Step 8: SITUACI\u00d3N OBLIGATORIA, el participante del turno responde a esto antes que a cualquier otro tema. VERSI\u00d3N M\u00cdNIMA DE LA COOPERATIVA: Marcelo Paz \u2014 Cooperativa textil dice qu\u00e9 tendr\u00eda que tener la versi\u00f3n m\u00ednima para que valga la pena en plena crisis, y si prefiere una plataforma propia de la c\u00e1mara, una alianza con un directorio existente u otra cosa. - Step 9: SITUACI\u00d3N OBLIGATORIA, el participante del turno responde a esto antes que a cualquier otro tema. VERSI\u00d3N M\u00cdNIMA DE LA OPERACI\u00d3N: Luc\u00eda Ferreyra \u2014 Operadora de la CIAI dice cu\u00e1l es la versi\u00f3n m\u00ednima que puede operar con su dedicaci\u00f3n parcial, cu\u00e1ntas horas por semana le llevar\u00eda, qu\u00e9 tareas quedan expl\u00edcitamente fuera y qu\u00e9 condici\u00f3n es imprescindible para que el piloto no quede abandonado, incluido qui\u00e9n adapta y aloja la plataforma. - Step 10: SITUACI\u00d3N OBLIGATORIA, el participante del turno responde a esto antes que a cualquier otro tema. FORMULACI\u00d3N FINAL: H\u00e9ctor Lan\u00fas \u2014 Comisi\u00f3n directiva fija formulacion_final y registra: el estado de cada hip\u00f3tesis (sostenida, condicionada o no sostenida) con su argumento principal; las funcionalidades indispensables, prescindibles y conflictivas; el piloto m\u00ednimo, si lo hay, con condiciones para marcas, talleres y c\u00e1mara; y los desacuerdos que quedan abiertos. No debe presentar como consenso lo que no lo fue. \n\nValeria Ortiz \u2014 Marca socia mediana\nCurrent grounded variable values (reassess ALL of these after each event):\n  - h1_marcas_usarian_el_servicio: condicionada  [allowed: pendiente, sostenida, condicionada, no_sostenida]  \u2014 Sostenida si las marcas describen un uso concreto que cambia lo que hacen hoy; condicionada si lo har\u00edan solo si se cumple algo; no sostenida si seguir\u00edan con sus alternativas actuales.\n  - h2_talleres_tendrian_incentivos: condicionada  [allowed: pendiente, sostenida, condicionada, no_sostenida]  \u2014 Sostenida si los talleres se registrar\u00edan y mantendr\u00edan la ficha con las reglas propuestas; condicionada si requieren cambios; no sostenida si no se sumar\u00edan.\n  - h3_informacion_declarada_es_util: condicionada  [allowed: pendiente, sostenida, condicionada, no_sostenida]  \u2014 Sostenida si las marcas contactar\u00edan a partir de ella; condicionada si depende de que est\u00e9 actualizada o incluya datos que hoy faltan; no sostenida si no les sirve para decidir.\n  - h4_camara_puede_sostenerlo: no_sostenida  [allowed: pendiente, sostenida, condicionada, no_sostenida]  \u2014 Sostenida si las tareas entran en la dedicaci\u00f3n parcial de la operadora; condicionada si depende de conseguir qui\u00e9n adapte y aloje la plataforma o de no asumir tareas de verificaci\u00f3n; no sostenida si excede sus recursos.\n  - h7_encontrarse_es_relevante_en_crisis: condicionada const ENTITY_MEMORIES = {};
const GM_MEMORIES = [];

function getContent(id) {
  const raw = CONTENT_STORE[id] || '';
  return resolveContentRefs(raw);
}

function resolveContentRefs(text) {
  if (typeof text !== 'string') return text;
  return text.replace(/!\[([^\]]*)\]\(content_ref:([a-f0-9]+)\)/g, function(m, alt, refId) {
    const data = CONTENT_STORE[refId];
    return data ? '![' + alt + '](' + data + ')' : m;
  });
}

function renderImageMarkdown(text) {
  return text.replace(/!\[([^\]]*)\]\((data:image\/[^)]+)\)/g, function(m, alt, src) {
    return '<img src="' + src + '" alt="' + alt + '" style="max-width:400px;max-height:400px;display:block;margin:8px 0;border-radius:4px;" loading=\"lazy\">';
  });
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML.replace(/\\n/g, '<br />');
}

function renderObject(obj) {
  if (obj === null || obj === undefined) {
    return '';
  }

  if (typeof obj === 'string') {
    if (obj.includes('data:image/')) {
      return renderImageMarkdown(escapeHtml(obj));
    }
    return escapeHtml(obj);
  }

  if (typeof obj === 'number' || typeof obj === 'boolean') {
    return String(obj);
  }

  if (Array.isArray(obj)) {
    let html = '';
    obj.forEach(item => {
      html += renderObject(item) + '<br />';
    });
    return html;
  }

  if (typeof obj === 'object') {
    if (obj._ref && Object.keys(obj).length === 1) {
      const content = getContent(obj._ref);
      if (content !== undefined) {
        if (content.includes('data:image/')) {
          return renderImageMarkdown(escapeHtml(content));
        }
        return escapeHtml(content);
      }
      return '[ref:' + obj._ref + ']';
    }

    // Determine summary from special keys (like PythonObjectToHTMLConverter)
    let summary = '';
    if (obj.date) {
      summary = escapeHtml(obj.date);
      if (obj.Summary) {
        summary += '  ' + escapeHtml(obj.Summary);
      }
    } else if (obj.Summary) {
      summary = escapeHtml(obj.Summary);
    } else if (obj.Name) {
      summary = escapeHtml(obj.Name);
    } else if (obj.Key) {
      summary = escapeHtml(obj.Key);
    } else if (obj.Value !== undefined || obj.value !== undefined) {
      // Entity data with a "Value" key - use "Details" as summary
      summary = 'Details';
    } else {
      // For all other objects, use "Details" as a generic summary
      summary = 'Details';
    }

    let html = '<details>';
    html += '<summary>' + summary + '</summary>';

    for (const [key, value] of Object.entries(obj)) {
      if (key !== 'date' && key !== 'Summary') {
        html += '<b><ul>' + escapeHtml(key) + '</b>';
        html += '<li>' + renderObject(value) + '</li></ul>';
      }
    }

    html += '</details>';
    return html;
  }

  return String(obj);
}

// Render object children directly without wrapping in outer <details>
// Used when we already have an outer details wrapper for the entity
function renderObjectChildren(obj) {
  if (obj === null || obj === undefined) {
    return '';
  }

  if (typeof obj !== 'object' || Array.isArray(obj)) {
    return renderObject(obj);
  }

  let html = '';
  for (const [key, value] of Object.entries(obj)) {
    if (key !== 'date' && key !== 'Summary') {
      html += '<b><ul>' + escapeHtml(key) + '</b>';
      html += '<li>' + renderObject(value) + '</li></ul>';
    }
  }
  return html;
}

function renderGMLog() {
  const container = document.getElementById('gm_log');
  let html = '';

  // Group entries by step
  const stepMap = {};
  ENTRIES.forEach(entry => {
    if (!stepMap[entry.step]) stepMap[entry.step] = [];
    stepMap[entry.step].push(entry);
  });

  const steps = Object.keys(stepMap).map(Number).sort((a, b) => a - b);

  steps.forEach(step => {
    const entries = stepMap[step];
    
    // Build step summary from entries
    let stepSummary = 'Step ' + step;
    if (entries.length > 0 && entries[0].summary) {
      stepSummary += ' --- ' + entries[0].summary;
    }
    
    html += '<details class="step-details" open>';
    html += '<summary><b>' + escapeHtml(stepSummary) + '</b></summary>';

    entries.forEach(entry => {
      // Create a label for this entry (like "Entity [name]" or component name)
      let entryLabel = entry.entity_name;
      if (entry.entry_type === 'entity') {
        entryLabel = 'Entity [' + entry.entity_name + ']';
      }
      
      // If entry has deduplicated_data, render it as collapsible content
      if (entry.deduplicated_data && Object.keys(entry.deduplicated_data).length > 0) {
        html += '<details>';
        html += '<summary>' + escapeHtml(entryLabel) + '</summary>';
        // Render all the data in deduplicated_data recursively
        for (const [key, value] of Object.entries(entry.deduplicated_data)) {
          html += '<b><ul>' + escapeHtml(key) + '</b>';
          html += '<li>' + renderObject(value) + '</li></ul>';
        }
        html += '</details>';
      } else {
        // Simple entry with no data
        html += '<div class="entry">';
        html += '<span class="entry-entity">' + escapeHtml(entryLabel) + '</span>';
        html += ' <span class="entry-component">(' + escapeHtml(entry.component_name) + ')</span>';
        if (entry.summary) {
          html += '<div class="entry-summary">' + escapeHtml(entry.summary) + '</div>';
        }
        html += '</div>';
      }
    });

    html += '</details>';
  });

  container.innerHTML = html || '<p>No log entries.</p>';
}

function renderEntityMemories(entityName, containerId) {
  const container = document.getElementById(containerId);
  const memories = ENTITY_MEMORIES[entityName] || [];
  let html = '';

  if (memories.length === 0) {
    html = '<p>No memories for ' + escapeHtml(entityName) + '.</p>';
  } else {
    memories.forEach(mem => {
      html += '<div class="memory-item">' + escapeHtml(mem) + '</div>';
    });
  }

  container.innerHTML = html;
}

function renderGMMemories() {
  const container = document.getElementById('gm_memories');
  if (!container) return;

  let html = '';
  if (GM_MEMORIES.length === 0) {
    html = '<p>No game master memories.</p>';
  } else {
    GM_MEMORIES.forEach(mem => {
      html += '<div class="memory-item">' + escapeHtml(mem) + '</div>';
    });
  }

  container.innerHTML = html;
}

function openTab(evt, tabId) {
  // Hide all tab content
  document.querySelectorAll('.tabcontent').forEach(tc => {
    tc.classList.remove('active');
  });

  // Remove active class from all buttons
  document.querySelectorAll('.tablinks').forEach(btn => {
    btn.classList.remove('active');
  });

  // Show the selected tab
  document.getElementById(tabId).classList.add('active');
  evt.currentTarget.classList.add('active');
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
  renderGMLog();

  // Render entity memories
  Object.keys(ENTITY_MEMORIES).forEach(name => {
    const containerId = name.replace(/ /g, '_');
    if (document.getElementById(containerId)) {
      renderEntityMemories(name, containerId);
    }
  });

  renderGMMemories();
});
</script>
