<style>
body { font-family: Arial, sans-serif; margin: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
.container { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
.tab { overflow: hidden; border-bottom: 2px solid #ddd; margin-bottom: 15px; }
.tab button { background-color: #f1f1f1; border: none; padding: 12px 24px; cursor: pointer; font-size: 14px; transition: all 0.3s; border-radius: 4px 4px 0 0; margin-right: 2px; }
.tab button:hover { background-color: #ddd; }
.tab button.active { background-color: #667eea; color: white; }
.tabcontent { display: none; padding: 15px; animation: fadeIn 0.3s; }
.tabcontent.active { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.step { margin: 10px 0; padding: 10px; background: #f9f9f9; border-left: 3px solid #667eea; border-radius: 4px; }
.step-header { font-weight: bold; color: #333; margin-bottom: 8px; }
.entry { margin: 5px 0; padding: 8px; background: white; border-radius: 4px; }
.entry-entity { color: #667eea; font-weight: bold; }
.entry-component { color: #888; font-size: 12px; }
.entry-summary { margin: 5px 0; }
.content-block { margin: 5px 0; padding: 8px; background: #f0f0f0; border-radius: 4px; font-family: monospace; font-size: 12px; white-space: pre-wrap; word-wrap: break-word; max-height: 200px; overflow-y: auto; }
.content-label { font-weight: bold; color: #555; font-size: 11px; text-transform: uppercase; }
.memory-item { margin: 5px 0; padding: 8px; background: #f9f9f9; border-radius: 4px; }
details { margin: 5px 0; }
details summary { cursor: pointer; font-weight: bold; padding: 5px; background: #f0f0f0; border-radius: 4px; }
details[open] summary { background: #e0e0e0; }
/* Step-level details get special styling with a colored left border */
details.step-details { margin: 10px 0; border-left: 3px solid #667eea; padding-left: 10px; }
details.step-details > summary { background: #e8e8ff; font-size: 14px; }
details.step-details[open] > summary { background: #d8d8ff; }
/* Content inside steps is indented */
details.step-details > details { margin-left: 15px; }
.summary { padding: 10px; background: #e8f4f8; border-radius: 4px; margin-bottom: 15px; }
h1 { color: #333; margin-bottom: 5px; }
.subtitle { color: #666; margin-bottom: 20px; }
</style>
</head>

const CONTENT_STORE = {"d5e7fe82653329e1": "Evitar comprometer fondos sin respaldo tecnico verificado.", "df2a7bf36c469044": "The instructions for how to play the role of Ana Duarte \u2014 Finanzas are as follows. This is a social science experiment studying how well you play the role of a character named Ana Duarte \u2014 Finanzas. The experiment is structured as a tabletop roleplaying game (like dungeons and dragons). However, in this case it is a serious social science experiment and simulation. The goal is to be realistic. It is important to play the role of a person like Ana Duarte \u2014 Finanzas as accurately as possible, i.e., by responding in ways that you think it is likely a person like Ana Duarte \u2014 Finanzas would respond, and taking into account all information about Ana Duarte \u2014 Finanzas that you have. Always use third-person limited perspective.", "c67ce3a1cb5dd7b6": "\nQuestion: What would a person like Ana Duarte \u2014 Finanzas do in a situation like this?\nAnswer", "f9a1ae502c6fcde8": "What would a person like Ana Duarte \u2014 Finanzas do in a situation like this? Respond using 1-5 sentences.", "6ff2a8a7d59e4bd7": "Ana Duarte \u2014 Finanzas would Ana Duarte would firmly refuse to authorize the disbursement until the missing technical documentation is fully completed and verified. Prioritizing institutional compliance and her own professional protection over Beto Salas's urgent operational demands, she would reject signing off on the funds while the audit hangs over her management. Instead of taking dangerous shortcuts or relying on provisional measures, she would stand her ground as a rigorous gatekeeper, insisting that the project team provide the proper respaldos before any money is released.", "409f22583bf30f28": "Goal: Evitar comprometer fondos sin respaldo tecnico verificado.", "801e61b3e1b8066e": "Question: What kind of person is Ana Duarte \u2014 Finanzas?", "8536d3c9699270b1": "Answer: Ana Duarte \u2014 Finanzas is a cautious, methodical, and risk-aware financial professional who prioritizes regulatory compliance and institutional accountability over hasty operational demands. Despite facing intense pressure and emotional appeals from colleagues like Beto Salas, she remains steadfast in protecting her integrity and avoiding unbacked financial commitments. Her careful deliberation over provisional measures, extensions, or outright denials demonstrates that she is a diligent gatekeeper who refuses to bypass protocols, even at the risk of delaying critical field operations.", "66c3f8f01344d0fc": "Question: What situation is Ana Duarte \u2014 Finanzas in right now?", "fedf77fcafcdd68f": "Answer: Ana Duarte \u2014 Finanzas is currently experiencing a high-pressure professional dilemma where she must balance project continuity against strict regulatory compliance. Pressured by Beto Salas to disburse funds for halted field operations, she is hesitant due to a pending audit on her management. Signing off without proper technical backing would leave her highly vulnerable to the control committee. Ultimately, she must decide whether to seek a provisional measure, request an extension to fix the missing documentation, or refuse the disbursement until the paperwork is fully completed.", "c058a7bb22dc4033": "[observation] //10:00 AM// La oficina est\u00e1 en silencio, interrumpido \u00fanicamente por el zumbido del aire acondicionado. Ana Duarte se encuentra sentada frente a su escritorio; frente a ella, Beto Salas la observa con una mezcla de impaciencia y preocupaci\u00f3n evidente. \u00c9l acaba de explicarle, una vez m\u00e1s, que los equipos t\u00e9cnicos est\u00e1n detenidos en el campo debido a la falta de este desembolso espec\u00edfico.  Ana tiene sobre su mesa el expediente del proyecto. Sabe que, tras la auditor\u00eda observada que pesa sobre su gesti\u00f3n, cualquier firma sin el debido respaldo t\u00e9cnico la pondr\u00eda en una posici\u00f3n de extrema vulnerabilidad ante el comit\u00e9 de control. Beto, por su parte, insiste en que el compromiso de pago es anterior a los problemas de documentaci\u00f3n y que el costo de oportunidad de seguir postergando la obra superar\u00e1 cualquier observaci\u00f3n administrativa.  Ana, la decisi\u00f3n recae ahora en c\u00f3mo proceder: \u00bfte inclinas por autorizar bajo alguna medida cautelar, buscas una pr\u00f3rroga para subsanar los faltantes, o te mantienes firme en la negativa hasta que el respaldo est\u00e9 completo?  [VARIABLES: NONE]", "bb152962b99c578e": "Question: What would a person like Ana Duarte \u2014 Finanzas do in a situation like this? Respond using 1-5 sentences.", "f058e87e17e2a6c4": "Answer: Ana Duarte \u2014 Finanzas would Ana Duarte would firmly refuse to authorize the disbursement until the missing technical documentation is fully completed and verified. Prioritizing institutional compliance and her own professional protection over Beto Salas's urgent operational demands, she would reject signing off on the funds while the audit hangs over her management. Instead of taking dangerous shortcuts or relying on provisional measures, she would stand her ground as a rigorous gatekeeper, insisting that the project team provide the proper respaldos before any money is released.", "a90494a197503832": "\nQuestion: What kind of person is Ana Duarte \u2014 Finanzas?\nAnswer", "8282d9de00323b82": "What kind of person is Ana Duarte \u2014 Finanzas? Respond using 1-5 sentences.", "91822b8b2a2f547a": "Ana Duarte \u2014 Finanzas is a cautious, methodical, and risk-aware financial professional who prioritizes regulatory compliance and institutional accountability over hasty operational demands. Despite facing intense pressure and emotional appeals from colleagues like Beto Salas, she remains steadfast in protecting her integrity and avoiding unbacked financial commitments. Her careful deliberation over provisional measures, extensions, or outright denials demonstrates that she is a diligent gatekeeper who refuses to bypass protocols, even at the risk of delaying critical field operations.", "a2e3faa81c031cf1": "Question: What kind of person is Ana Duarte \u2014 Finanzas? Respond using 1-5 sentences.", "4c6872f04c8ff7b0": "\nQuestion: What situation is Ana Duarte \u2014 Finanzas in right now?\nAnswer", "39affda18441edec": "What kind of situation is Ana Duarte \u2014 Finanzas in right now? Respond using 1-5 sentences.", "a5fad8ad6dbde10d": "Ana Duarte \u2014 Finanzas is currently experiencing a high-pressure professional dilemma where she must balance project continuity against strict regulatory compliance. Pressured by Beto Salas to disburse funds for halted field operations, she is hesitant due to a pending audit on her management. Signing off without proper technical backing would leave her highly vulnerable to the control committee. Ultimately, she must decide whether to seek a provisional measure, request an extension to fix the missing documentation, or refuse the disbursement until the paperwork is fully completed.", "4ac457ff855595c2": "Question: What kind of situation is Ana Duarte \u2014 Finanzas in right now? Respond using 1-5 sentences.", "1cc5fa7b2c085c67": "Event: En la oficina de gesti\u00f3n, Ana Duarte, responsable de Finanzas, apoya la pluma sobre la mesa sin firmar el formulario. Con una expresi\u00f3n seria y la presi\u00f3n de una auditor\u00eda en curso, mira a Beto Salas a los ojos y declara con firmeza: \"No puedo autorizar ning\u00fan movimiento de fondos sin el respaldo t\u00e9cnico completo. Exijo que el equipo t\u00e9cnico regularice la documentaci\u00f3n faltante antes de volver a evaluar cualquier tipo de desembolso\". Como resultado, la decisi\u00f3n sobre el desembolso permanece bloqueada ante la negativa de Ana, manteniendo los equipos de Beto inactivos.\n\n[VARIABLES: NONE]\n", "9559332624ba8d13": "Because of all that came before, what happens next?", "4f90faff1bbe1a3a": "Game master instructions: :\nThis is a social science expe const ENTITY_MEMORIES = {};
const GM_MEMORIES = [];

function getContent(id) {
  const raw = CONTENT_STORE[id] || '';
  return resolveContentRefs(raw);
}

function resolveContentRefs(text) {
  if (typeof text !== 'string') return text;
  return text.replace(/!\[([^\]]*)\]\(content_ref:([a-f0-9]+)\)/g, function(m, alt, refId) {
    const data = CONTENT_STORE[refId];
    return data ? '![' + alt + '](' + data + ')' : m;
  });
}

function renderImageMarkdown(text) {
  return text.replace(/!\[([^\]]*)\]\((data:image\/[^)]+)\)/g, function(m, alt, src) {
    return '<img src="' + src + '" alt="' + alt + '" style="max-width:400px;max-height:400px;display:block;margin:8px 0;border-radius:4px;" loading=\"lazy\">';
  });
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML.replace(/\\n/g, '<br />');
}

function renderObject(obj) {
  if (obj === null || obj === undefined) {
    return '';
  }

  if (typeof obj === 'string') {
    if (obj.includes('data:image/')) {
      return renderImageMarkdown(escapeHtml(obj));
    }
    return escapeHtml(obj);
  }

  if (typeof obj === 'number' || typeof obj === 'boolean') {
    return String(obj);
  }

  if (Array.isArray(obj)) {
    let html = '';
    obj.forEach(item => {
      html += renderObject(item) + '<br />';
    });
    return html;
  }

  if (typeof obj === 'object') {
    if (obj._ref && Object.keys(obj).length === 1) {
      const content = getContent(obj._ref);
      if (content !== undefined) {
        if (content.includes('data:image/')) {
          return renderImageMarkdown(escapeHtml(content));
        }
        return escapeHtml(content);
      }
      return '[ref:' + obj._ref + ']';
    }

    // Determine summary from special keys (like PythonObjectToHTMLConverter)
    let summary = '';
    if (obj.date) {
      summary = escapeHtml(obj.date);
      if (obj.Summary) {
        summary += '  ' + escapeHtml(obj.Summary);
      }
    } else if (obj.Summary) {
      summary = escapeHtml(obj.Summary);
    } else if (obj.Name) {
      summary = escapeHtml(obj.Name);
    } else if (obj.Key) {
      summary = escapeHtml(obj.Key);
    } else if (obj.Value !== undefined || obj.value !== undefined) {
      // Entity data with a "Value" key - use "Details" as summary
      summary = 'Details';
    } else {
      // For all other objects, use "Details" as a generic summary
      summary = 'Details';
    }

    let html = '<details>';
    html += '<summary>' + summary + '</summary>';

    for (const [key, value] of Object.entries(obj)) {
      if (key !== 'date' && key !== 'Summary') {
        html += '<b><ul>' + escapeHtml(key) + '</b>';
        html += '<li>' + renderObject(value) + '</li></ul>';
      }
    }

    html += '</details>';
    return html;
  }

  return String(obj);
}

// Render object children directly without wrapping in outer <details>
// Used when we already have an outer details wrapper for the entity
function renderObjectChildren(obj) {
  if (obj === null || obj === undefined) {
    return '';
  }

  if (typeof obj !== 'object' || Array.isArray(obj)) {
    return renderObject(obj);
  }

  let html = '';
  for (const [key, value] of Object.entries(obj)) {
    if (key !== 'date' && key !== 'Summary') {
      html += '<b><ul>' + escapeHtml(key) + '</b>';
      html += '<li>' + renderObject(value) + '</li></ul>';
    }
  }
  return html;
}

function renderGMLog() {
  const container = document.getElementById('gm_log');
  let html = '';

  // Group entries by step
  const stepMap = {};
  ENTRIES.forEach(entry => {
    if (!stepMap[entry.step]) stepMap[entry.step] = [];
    stepMap[entry.step].push(entry);
  });

  const steps = Object.keys(stepMap).map(Number).sort((a, b) => a - b);

  steps.forEach(step => {
    const entries = stepMap[step];
    
    // Build step summary from entries
    let stepSummary = 'Step ' + step;
    if (entries.length > 0 && entries[0].summary) {
      stepSummary += ' --- ' + entries[0].summary;
    }
    
    html += '<details class="step-details" open>';
    html += '<summary><b>' + escapeHtml(stepSummary) + '</b></summary>';

    entries.forEach(entry => {
      // Create a label for this entry (like "Entity [name]" or component name)
      let entryLabel = entry.entity_name;
      if (entry.entry_type === 'entity') {
        entryLabel = 'Entity [' + entry.entity_name + ']';
      }
      
      // If entry has deduplicated_data, render it as collapsible content
      if (entry.deduplicated_data && Object.keys(entry.deduplicated_data).length > 0) {
        html += '<details>';
        html += '<summary>' + escapeHtml(entryLabel) + '</summary>';
        // Render all the data in deduplicated_data recursively
        for (const [key, value] of Object.entries(entry.deduplicated_data)) {
          html += '<b><ul>' + escapeHtml(key) + '</b>';
          html += '<li>' + renderObject(value) + '</li></ul>';
        }
        html += '</details>';
      } else {
        // Simple entry with no data
        html += '<div class="entry">';
        html += '<span class="entry-entity">' + escapeHtml(entryLabel) + '</span>';
        html += ' <span class="entry-component">(' + escapeHtml(entry.component_name) + ')</span>';
        if (entry.summary) {
          html += '<div class="entry-summary">' + escapeHtml(entry.summary) + '</div>';
        }
        html += '</div>';
      }
    });

    html += '</details>';
  });

  container.innerHTML = html || '<p>No log entries.</p>';
}

function renderEntityMemories(entityName, containerId) {
  const container = document.getElementById(containerId);
  const memories = ENTITY_MEMORIES[entityName] || [];
  let html = '';

  if (memories.length === 0) {
    html = '<p>No memories for ' + escapeHtml(entityName) + '.</p>';
  } else {
    memories.forEach(mem => {
      html += '<div class="memory-item">' + escapeHtml(mem) + '</div>';
    });
  }

  container.innerHTML = html;
}

function renderGMMemories() {
  const container = document.getElementById('gm_memories');
  if (!container) return;

  let html = '';
  if (GM_MEMORIES.length === 0) {
    html = '<p>No game master memories.</p>';
  } else {
    GM_MEMORIES.forEach(mem => {
      html += '<div class="memory-item">' + escapeHtml(mem) + '</div>';
    });
  }

  container.innerHTML = html;
}

function openTab(evt, tabId) {
  // Hide all tab content
  document.querySelectorAll('.tabcontent').forEach(tc => {
    tc.classList.remove('active');
  });

  // Remove active class from all buttons
  document.querySelectorAll('.tablinks').forEach(btn => {
    btn.classList.remove('active');
  });

  // Show the selected tab
  document.getElementById(tabId).classList.add('active');
  evt.currentTarget.classList.add('active');
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
  renderGMLog();

  // Render entity memories
  Object.keys(ENTITY_MEMORIES).forEach(name => {
    const containerId = name.replace(/ /g, '_');
    if (document.getElementById(containerId)) {
      renderEntityMemories(name, containerId);
    }
  });

  renderGMMemories();
});
</script>
